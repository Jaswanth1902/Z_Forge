<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-zf" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1C140E" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0E0B08" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080605" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-zf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7732"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#080605"/>
  <rect width="1200" height="420" fill="url(#vignette-zf)"/>

  <!-- Frame -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Da Vinci Mechanical Cogwheel & LZW Trie Tree (Left Visual) -->
  <g transform="translate(225, 210)" stroke="#C5A059" fill="none">
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="165"/>
      <circle cx="0" cy="0" r="120"/>
      <circle cx="0" cy="0" r="75"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
    </g>

    <!-- C99 Gear Profile -->
    <path d="M0,-85 L12,-75 L28,-78 L35,-65 L50,-62 L52,-48 L65,-40 L62,-25 L72,-12 L65,0 L72,12 L62,25 L65,40 L52,48 L50,62 L35,65 L28,78 L12,75 L0,85 L-12,75 L-28,78 L-35,65 L-50,62 L-52,48 L-65,40 L-62,25 L-72,12 L-65,0 L-72,-12 L-62,-25 L-65,-40 L-52,-48 L-50,-62 L-35,-65 L-28,-78 L-12,-75 Z"
          stroke="url(#gold-zf)" stroke-width="1.2" fill="#18110B" fill-opacity="0.7"/>

    <!-- Inner Anvil / Core Hub -->
    <circle cx="0" cy="0" r="38" stroke="#F97316" stroke-width="1"/>
    <circle cx="0" cy="0" r="16" fill="#F97316" fill-opacity="0.3" stroke="#C5A059" stroke-width="0.8"/>

    <!-- LZW Trie Branch Lines -->
    <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
      <line x1="0" y1="38" x2="-45" y2="105"/>
      <line x1="0" y1="38" x2="0" y2="115"/>
      <line x1="0" y1="38" x2="45" y2="105"/>
      <circle cx="-45" cy="105" r="3" fill="#C5A059"/>
      <circle cx="0" cy="115" r="3" fill="#F97316"/>
      <circle cx="45" cy="105" r="3" fill="#C5A059"/>
    </g>

    <text x="-165" y="-140" fill="#C5A059" opacity="0.45" font-size="9" class="mono-tech">FIG. XI — DUAL COMPRESSION CORE</text>
    <text x="-165" y="145" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">C99 FAST RUNTIME • MEMORY BOUND</text>
    <text x="-165" y="160" fill="#F97316" opacity="0.5" font-size="8" class="mono-tech">LZW DICTIONARY TRIE BENCHMARK</text>
  </g>

  <!-- Typography (Center-Right) -->
  <g transform="translate(465, 0)">
    <text x="0" y="125" fill="#C5A059" font-size="11" letter-spacing="4" class="serif-title" opacity="0.85">
      HIGH-THROUGHPUT LZW BENCHMARK &amp; SYSTEMS TOOLING
    </text>

    <text x="0" y="185" fill="#FDFBF7" font-size="46" letter-spacing="12" class="serif-title">
      Z _ F O R G E
    </text>

    <g transform="translate(0, 210)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="420" y2="0" stroke-width="0.8"/>
      <circle cx="210" cy="0" r="3" fill="#C5A059"/>
      <circle cx="105" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="315" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <text x="0" y="245" fill="#C5BEB3" font-size="14" letter-spacing="2" class="serif-title" opacity="0.9">
      DUAL C99 / PYTHON 3 • EMPIRICAL PROFILING • LZW ENGINE
    </text>

    <text x="0" y="275" fill="#8C857B" font-size="13" class="serif-sub">
      Microsecond compression benchmarks comparing pure C99 efficiency against Python reference implementations.
    </text>

    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="130" height="24" rx="2" fill="#17110C" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="65" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">C99 NATIVE CORE</text>

      <rect x="142" y="0" width="135" height="24" rx="2" fill="#17110C" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="209" y="16" fill="#F97316" font-size="10" text-anchor="middle" class="mono-tech">PYTHON 3 RUNTIME</text>

      <rect x="289" y="0" width="145" height="24" rx="2" fill="#17110C" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="361" y="16" fill="#10B981" font-size="10" text-anchor="middle" class="mono-tech">EMPIRICAL STATS</text>
    </g>

    <text x="0" y="365" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      EX COMPRESSIONE VIRTUOSA • ANNO MMXXVI • OPEN SYSTEMS
    </text>
  </g>
</svg>